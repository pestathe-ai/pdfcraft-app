name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compila il sito PDFCraft
        run: |
          set -o pipefail
          chmod +x tool/build_web.sh
          if ! ./tool/build_web.sh 2>&1 | tee web.log; then
            grep -n -i -E 'error|failed|exception|cannot|not found|Type error' web.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=web::$(cat err.txt)"
            exit 1
          fi
          echo "::notice title=web::$(tail -1 web.log)"

      - name: Test unitari
        run: |
          set -o pipefail
          if ! gradle -p android --no-daemon testReleaseUnitTest 2>&1 | tee test.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|expected|e: ' test.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=test::$(cat err.txt)"
            exit 1
          fi

      - name: Compila APK
        run: |
          set -o pipefail
          if ! gradle -p android --no-daemon assembleRelease 2>&1 | tee apk.log; then
            grep -n -i -E 'error|what went wrong|failed|exception|e: ' apk.log | tail -40 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > err.txt
            echo "::error title=apk::$(cat err.txt)"
            exit 1
          fi

      - name: Firma APK
        run: |
          set -euo pipefail
          BT="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "${BT}zipalign" -p -f 4 "$IN" aligned.apk
          "${BT}apksigner" sign --ks tool/signing/app.jks --ks-key-alias app \
            --ks-pass pass:mj7BMEWQC3FcHK3kCB2a --key-pass pass:mj7BMEWQC3FcHK3kCB2a \
            --out DDocsLab.apk aligned.apk
          "${BT}apksigner" verify DDocsLab.apk
          echo "::notice title=apk::DDocsLab.apk $(du -h DDocsLab.apk | cut -f1)"

      - name: Analisi dimensioni APK
        run: |
          python3 - <<'PY' > sizes.txt
          import zipfile, collections
          z = zipfile.ZipFile('DDocsLab.apk')
          raw = collections.Counter(); packed = collections.Counter(); stored = collections.Counter()
          for i in z.infolist():
              name = i.filename.split('/')[-1]
              ext = name.rsplit('.', 1)[-1] if '.' in name else '-'
              raw[ext] += i.file_size; packed[ext] += i.compress_size
              if i.compress_type == 0: stored[ext] += 1
          for ext, size in packed.most_common(15):
              print(f"{ext}: {raw[ext]>>20}MB -> {size>>20}MB (non compressi: {stored[ext]})")
          PY
          echo "::notice title=sizes::$(sed 's/%/%25/g' sizes.txt | awk 'BEGIN{ORS="%0A"} {print}')"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: D. Docs lab (build ${{ github.run_number }})
          files: DDocsLab.apk
          body: |
            Scarica **DDocsLab.apk** dal telefono e installalo. D. Docs lab è un'app Dom Studio.
            Basato su PDFCraft (PDFCraftTool/pdfcraft) alla versione indicata in UPSTREAM_REF.
